<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account | CyberMouse Academy</title>
    <link rel="stylesheet" href="{% static 'css/registration.css' %}">
</head>
<body>
    <main class="rectangle">
        <header><h1 class="titre">Create an account</h1></header>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}
            </div>
        {% endif %}
        <section>
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-submit">Create account</button>
            </form>
            <p class="texte-acceuil">Already have an account? <a href="{% url 'login' %}">Sign in</a>.</p>
        </section>
    </main>
</body>
</html>
