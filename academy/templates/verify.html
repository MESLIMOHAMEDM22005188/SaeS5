<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone verification | CyberMouse Academy</title>
    <link rel="stylesheet" href="{% static 'css/verify.css' %}">
</head>
<body>
    <main class="verification-card">
        <h1>Verify your phone number</h1>
        <p>Enter the verification code sent to your phone.</p>
        <form method="post">
            {% csrf_token %}
            <label for="code">Verification code</label>
            <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter your code" required>
            <button type="submit">Verify phone</button>
        </form>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
            </ul>
        {% endif %}
    </main>
</body>
</html>
