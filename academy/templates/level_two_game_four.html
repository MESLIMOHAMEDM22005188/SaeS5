<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewall Wall</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/level_two_game_four.css' %}">
</head>
<body>

<div class="game-container">
    <h1>Firewall Wall</h1>

    <div id="question-container">
        <div class="question" id="question-1">
            <p>What is the role of a firewall?</p>
            <button class="answer-button" data-answer="B">A. Block access to the internet</button>
            <button class="answer-button" data-answer="B">B. Protect a network from external attacks</button>
            <button class="answer-button" data-answer="C">C. Increase internet speed</button>
            <button class="answer-button" data-answer="D">D. Manage local IP addresses</button>
        </div>

        <div class="question" id="question-2" style="display: none;">
            <p>What does antivirus software do?</p>
            <button class="answer-button" data-answer="B">A. Increase PC speed</button>
            <button class="answer-button" data-answer="B">B. Remove malware</button>
            <button class="answer-button" data-answer="C">C. Manage networks</button>
            <button class="answer-button" data-answer="D">D. Optimize memory</button>
        </div>

        <div class="question" id="question-3" style="display: none;">
            <p>Which protocol secures internet connections?</p>
            <button class="answer-button" data-answer="C">A. HTTP</button>
            <button class="answer-button" data-answer="C">B. FTP</button>
            <button class="answer-button" data-answer="C">C. HTTPS</button>
            <button class="answer-button" data-answer="D">D. SMTP</button>
        </div>

        <div class="question" id="question-4" style="display: none;">
            <p>Qu'est-ce qu'un malware ?</p>
            <button class="answer-button" data-answer="B">A. Un logiciel antivirus</button>
            <button class="answer-button" data-answer="B">B. Un logiciel malveillant</button>
            <button class="answer-button" data-answer="C">C. Un logiciel de protection</button>
            <button class="answer-button" data-answer="D">D. An operating system</button>
        </div>

        <div class="question" id="question-5" style="display: none;">
            <p>Which tool detects network vulnerabilities?</p>
            <button class="answer-button" data-answer="A">A. Un scanner de port</button>
            <button class="answer-button" data-answer="B">B. Un pare-feu</button>
            <button class="answer-button" data-answer="C">C. Un VPN</button>
            <button class="answer-button" data-answer="D">D. Un antivirus</button>
        </div>

        <div class="question" id="question-6" style="display: none;">
            <p>Que fait un VPN ?</p>
            <button class="answer-button" data-answer="A">A. Hide your IP address</button>
            <button class="answer-button" data-answer="B">B. Bloque les attaques externes</button>
            <button class="answer-button" data-answer="C">C. Augmente la vitesse d'Internet</button>
            <button class="answer-button" data-answer="D">D. Protect email</button>
        </div>
    </div>

    <div id="wall-container"></div>

    <div id="feedback"></div>
    <div id="score-container">
        <p>Score : <span id="score">0</span></p>
    </div>

<button id="replay-button" style="display: none;">Rejouer</button>
 <a href="{% url 'level_two' %}" id="back-to-menu" class="back-to-menu">
        <button class="menu-button">Back to menu</button>
    </a>
</div>

<script src="{% static 'js/level_two_game_four.js' %}"></script>

</body>
</html>
