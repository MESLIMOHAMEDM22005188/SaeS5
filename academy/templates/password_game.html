<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How long would it take to crack ?</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/password_strength.css' %}">
</head>
<body>
    <div class="container">
         <a href="/level-two/" id="back-to-menu" class="back-to-menu">
        <button class="menu-button">Back to menu</button>
    </a>
        <h1>How long would it take to crack your password?</h1>
        <div class="password-checker">
            <label for="password">Enter a password:</label>
            <div class="password-input-wrapper">
                <input type="password" id="password" placeholder="Enter your password here">
                <button id="togglePassword">Show</button>
            </div>
            <button id="checkBtn">Check</button>
        </div>

        <div id="results">
            <p id="feedback"></p>
            <p id="crackTime"></p>
            <p id="complexity"></p>
        </div>
    </div>

    <script src="{% static 'js/password_strength.js' %}"></script>
</body>
</html>
