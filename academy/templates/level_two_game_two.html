<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bureau Level 2</title>
    {% load static %}
    <!-- Styles CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/desktop.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/email_window.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/browser.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/modal_window.css' %}">
</head>
<body>

<div class="content">
    <!-- Applications sur le bureau -->
    <div class="bureau">
        <div class="app-ico">
            <img src="{% static 'image/bouklook.png' %}" alt="outlook" class="outlook-app" onclick="openEmailWindow()">
            <div class="app-name">Bouklook</div>
        </div>
        <div class="app-ico">
            <img src="{% static 'image/gogole.png' %}" alt="gogole" class="gogole-app" onclick="openBrowserWindow()">
            <div class="app-name">Gogole</div>
        </div>
    </div>
</div>

<div class="points-display" id="points-display">Points: 0</div>

<div class="bottom-bar">

     <a href="{% url 'level_two' %}" id="back-to-menu" class="left-info">
  <img src="{% static 'image/mail_app_button.png' %}" alt="boutton" class="bouttonMA">
</a>

    <div class="center-app">
        <img src="{% static 'image/window_11.png' %}" alt="window" class="window">
        <img src="{% static 'image/outlook.png' %}" alt="outlook" class="outlook" onclick="openEmailWindow()">
    </div>
    <div class="right-info">
        <img src="{% static 'image/eternity.png' %}" alt="internet" class="icon1" id="internetIcon" onClick="showModal()">
        <img src="{% static 'image/battery.png' %}" alt="batterie" class="batterie">
        <img src="{% static 'image/sound.png' %}" alt="Son" class="icon">
        <img src="{% static 'image/clock.png' %}" alt="heure" class="heure">
    </div>
</div>

<div id="modalWindow" class="hidden"></div>

<script src="{% static 'js/email_window.js' %}"></script>
<script src="{% static 'js/browser_window.js' %}"></script>
<script src="{% static 'js/modal_window.js' %}"></script>

</body>
</html>
