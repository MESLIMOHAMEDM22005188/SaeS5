<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 2</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'image/logo_bureau.png' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/level_two_game_one.css' %}">
</head>
<body>
    <button id="restart-button" class="restart-button">Restart</button>
    <a href="/level-two/" id="back-to-menu" class="back-to-menu">
        <button class="menu-button">Back to menu</button>
    </a>

    <div class="fortress">
        <img src="{% static 'image/fortress.png' %}" id="fortress" alt="Fortress">
        <div id="fortressParts">
            <div id="porte">
                <img src="{% static 'image/porte.png' %}" alt="Porte de la fortress" class="close-ico">
            </div>
            <div id="tourDroite">
                <img src="{% static 'image/tourDroite.png' %}" alt="Tour droite de la fortress" class="close-ico">
            </div>
            <div id="tourGauche">
                <img src="{% static 'image/tourGauche.png' %}" alt="Tour gauche de la fortress" class="close-ico">
            </div>
        </div>
    </div>

    <form id="password-form">
        <input type="password" id="password" placeholder="Enter votre password">
        <button type="button" id="submitBtn">Renforcer la Fortress</button>
        <button type="button" id="togglePassword">Show</button>
        <div id="feedback" class="feedback"></div>
    </form>

    <script src="{% static 'js/fortress_game.js' %}"></script>
</body>
</html>
