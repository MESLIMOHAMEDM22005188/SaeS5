<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/level_two.css' %}">
    <style>
        body { background: #080d18; color: #f3f7ff; }
        .placeholder { width: min(620px, calc(100% - 32px)); margin: 12vh auto; padding: 36px; border: 1px solid rgba(174,195,225,.2); border-radius: 22px; background: #101827; }
        .tag { color: #c6f36b; font-size: .75rem; letter-spacing: .16em; font-weight: 800; }
        h1 { margin: 14px 0; font-size: clamp(1.9rem, 5vw, 3rem); letter-spacing: -.04em; }
        p { color: #a0aec2; line-height: 1.7; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
        .actions a { display: inline-flex; padding: 12px 16px; border-radius: 10px; background: #c6f36b; color: #08120d; font-weight: 800; }
        .actions a.secondary { background: transparent; color: #f3f7ff; border: 1px solid rgba(174,195,225,.2); }
    </style>
</head>
<body>
    <main class="placeholder">
        <p class="tag">CYBERMOUSE ACADEMY / NIVEAU 02</p>
        <h1>Ce module arrive bientôt.</h1>
        <p>Cette activité n'est pas encore implémentée. Les autres exercices du niveau 2 restent accessibles depuis le parcours.</p>
        <div class="actions">
            <a href="{% url 'level_two' %}">Back to level 2</a>
            <a class="secondary" href="{% url 'home' %}">Tableau de bord</a>
        </div>
    </main>
</body>
</html>
